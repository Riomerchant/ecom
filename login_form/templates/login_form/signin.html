{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'login_form/css/style.css' %}">

</head>
<body>
  <div class="container">
    <!-- Left: Image -->
    <div class="left-side">
      <img src="{% static 'login_form/images/login_img.png' %}" style="margin-top: 56px;
    margin-left: 60px;
    width: 85%;
    height: 90%;
    object-fit: contain;" alt="Login background">
    </div>
    <!-- Right: Form -->
    <div class="right-side" style="background: white;">
      <div class="form-box" style="width: 99%;
          margin-right: 60px;
    /* padding-top: 1px; */
    height: 400px;
    max-width: 400px;
    background: #4803ff47;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);">
        <h2>Welcome Back</h2>
        <form method="POST" action="{% url 'signin' %}" style="margin: 15px;">
          {% csrf_token %}
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>
          <button type="submit">Login</button>
          <p class="signup-text">Don’t have an account? <a href="{% url 'signup' %}">Sign up</a></p>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
