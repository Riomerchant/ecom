{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .product-form-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        h2 {
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .btn-dark {
            width: 100%;
        }
        label {
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="product-form-container">
    <h2>Add Product</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="mb-3">
            <label>Product Title</label>
            <input type="text" name="title" class="form-control" placeholder="Enter product title" required>
        </div>

        <div class="mb-3">
            <label>Slug</label>
            <input type="text" name="slug" class="form-control" placeholder="Unique slug (e.g., cool-shirt)">
        </div>

        <div class="mb-3">
            <label>Category</label>
            <select name="category" class="form-select" required>
                {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="4" placeholder="Product description"></textarea>
        </div>

        <div class="mb-3">
            <label>Price</label>
            <input type="number" step="0.01" name="price" class="form-control" placeholder="Enter price" required>
        </div>

        <div class="mb-3">
            <label>Product Image</label>
            <input type="file" name="img" class="form-control">
        </div>

        <button type="submit" class="btn btn-dark">Add Product</button>
    </form>
</div>

</body>
</html>
